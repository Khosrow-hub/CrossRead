services:
  postgres:
    image: postgres:16-alpine
    container_name: crossread-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crossread
      POSTGRES_PASSWORD: crossread_dev
      POSTGRES_DB: crossread
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - crossread_pgdata:/var/lib/postgresql/data
    command: >
      postgres
      -c ssl=off
      -c listen_addresses=*
      -c max_connections=100

volumes:
  crossread_pgdata: