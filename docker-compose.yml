services:
  postgres:
    image: postgres:16-alpine
    container_name: crossread-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: crossread
      POSTGRES_PASSWORD: crossread_dev
      POSTGRES_DB: crossread
    ports:
      - "5433:5432"
    volumes:
      - crossread_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crossread"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  crossread_pgdata: